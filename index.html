function chart(it, fr){

  if (fc){ for (const v of fc.p50) { lo=Math.min(lo,v); hi=Math.max(hi,v); } }

  const y = v => T + (hi-v)/(hi-lo)*h, step = w/(bars.length+nf), bw = Math.max(1, step*0.65);

    const top = y(Math.max(b[1],b[4])), ht = Math.max(0.8, Math.abs(y(b[1])-y(b[4])));

      s += `<polygon points="${top.concat(bot).map(p=>p.join(',')).join(' ')}" fill="#6b7f99" fill-opacity="0.18" stroke="#6b7f99" stroke-opacity="0.5" stroke-width="0.6"/>`;
      s += `<text x="${x0+3}" y="${T+10}" font-size="9" fill="#4b5d75">想定レンジ</text>`;
    }
    if (fc){
      s += `<polyline points="${[[x0,y(last)], ...fc.t.map((_,i)=>[L + (bars.length+i+0.5)*step, y(fc.p50[i])])].map(p=>p.join(',')).join(' ')}" fill="none" stroke="#b26b00" stroke-width="1.2" stroke-dasharray="4 2"/>`;

  for (const gid of tab.groups){
    const g = G[gid]; if (!g) continue;
    if (tab.heat===gid) h += heat(g);
    h += `<h2>${esc(g.name)}</h2><div class="grid">` + g.items.map(it=>card(it,fr)).join('') + '</div>';
  }
  return h;
}

function news(){
  if (!D.news.length) return '<p class="muted">ニュースを取得できませんでした。</p>';
  return '<div class="box news"><ul>' + D.news.map(n=>`<li><span class="meta num">${n.t?fmtT(n.t,'h'):''}・${esc(n.src)}</span><a href="${esc(n.link)}" target="_blank" rel="noopener">${esc(n.title)}</a></li>`).join('') + '</ul></div>' +
    '<p class="note">今日の経済指標・決算の予定は第2段以降で追加予定。</p>';
}

function render(id){
  const tab = TABS.find(t=>t.id===id) || TABS[0];
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on', b.dataset.id===tab.id));
  const m = document.getElementById('main');
  m.innerHTML = tab.id==='sum'? summary() : tab.id==='news'? news() : tab.id==='score'? score() : tab.id==='help'? HELP : groupTab(tab);
  bindHover();
  history.replaceState(null,'','#'+tab.id);
}

function bindHover(){
  document.querySelectorAll('.chart svg').forEach(svg=>{
    const box = svg.parentElement, it = findItem(box.dataset.t), fr = box.dataset.f;
    const bars = (it.bars[fr]||[]).slice(-SHOW[fr]), tip = box.querySelector('.tip'), cur = svg.querySelector('.cur');
    const rg = rngOf(it, fr), fc = SHOWKR? fcOf(it, fr) : null, nf = rg? rg.t.length : (fc? fc.t.length : 0), step = (320-56)/(bars.length+nf);
    svg.addEventListener('mousemove', e=>{
      const r = svg.getBoundingClientRect(), x = (e.clientX-r.left)/r.width*320;
      const i = Math.min(bars.length+nf-1, Math.max(0, Math.floor((x-4)/step)));
      const cx = 4 + (i+0.5)*step;
      cur.setAttribute('x1',cx); cur.setAttribute('x2',cx); cur.setAttribute('visibility','visible');
      if (i < bars.length){
        const b = bars[i];
        tip.textContent = `${fmtT(b[0],fr)}  始${fmt(b[1],it.dec)} 高${fmt(b[2],it.dec)} 安${fmt(b[3],it.dec)} 終${fmt(b[4],it.dec)}`;
      } else {
        const j = i - bars.length;
        const tt = (rg||fc).t[j];
        tip.textContent = `${fmtT(tt,fr)}  ` + (rg? `想定レンジ ${fmt(rg.lo[j],it.dec)}〜${fmt(rg.hi[j],it.dec)}` : '') + (fc? `  Kronos ${fmt(fc.p50[j],it.dec)}` : '');
      }
    });
    svg.addEventListener('mouseleave', ()=>{ cur.setAttribute('visibility','hidden'); tip.textContent=''; });
  });
}
function findItem(t){ for (const g of D.groups) for (const it of g.items) if (it.ticker===t) return it; }

document.getElementById('nav').innerHTML = TABS.map(t=>`<button data-id="${t.id}">${t.name}</button>`).join('');
document.getElementById('nav').addEventListener('click', e=>{ if (e.target.dataset.id) render(e.target.dataset.id); });
document.getElementById('main').addEventListener('change', e=>{
  if (e.target.id==='kr'){ SHOWKR = e.target.checked; render(e.target.dataset.tab); }
});
document.getElementById('main').addEventListener('click', e=>{
  const b = e.target.closest('button[data-fr]'); if (!b) return;
  frameOf[b.dataset.tab] = b.dataset.fr; render(b.dataset.tab);
});
render(location.hash.slice(1) || 'sum');
</script>
</body>
